<h1>ytp-rclone</h1>
<p>ytp-rclone is a personal OAuth client used by the owner of this GitHub account to run <a href="https://rclone.org/">rclone</a> against the owner's own Google Drive. It syncs files for a private, personal podcast feed.</p>
<p>It is not offered to other users. There is no sign-up and no public service.</p>
